
name: Auto Assign Optional Reviewer

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest

    steps:
      - name: Request Optional Reviewer
        uses: actions/github-script@v7

        with:
          script: |
            const reviewer = 'ashirwadsharma151';

            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;

            // Get PR details
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            // Do not request the PR author
            if (pr.user.login.toLowerCase() === reviewer.toLowerCase()) {
              core.info('Reviewer is the PR author. Skipping.');
              return;
            }

            // Check whether reviewer is already requested
            const alreadyRequested = pr.requested_reviewers.some(
              user => user.login.toLowerCase() === reviewer.toLowerCase()
            );

            if (alreadyRequested) {
              core.info('Reviewer is already requested.');
              return;
            }

            // Request optional review
            await github.rest.pulls.requestReviewers({
              owner,
              repo,
              pull_number,
              reviewers: [reviewer]
            });

            core.info(`Successfully requested review from ${reviewer}`);
